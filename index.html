<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mein erstes Projekt</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --accent: #c8f547;
      --accent2: #7b61ff;
      --text: #f0ede6;
      --muted: #6b6b7a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--accent2); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; animation-delay: -4s; }
    .blob-3 { width: 300px; height: 300px; background: #ff61d2; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Main card */
    .card {
      position: relative;
      background: rgba(19,19,26,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 56px 64px;
      max-width: 620px;
      width: 90%;
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: rgba(200,245,71,0.12);
      color: var(--accent);
      border: 1px solid rgba(200,245,71,0.3);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 28px;
      animation: fadeUp 0.9s 0.1s cubic-bezier(.22,1,.36,1) both;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
      animation: fadeUp 0.9s 0.2s cubic-bezier(.22,1,.36,1) both;
    }

    h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 40px;
      animation: fadeUp 0.9s 0.3s cubic-bezier(.22,1,.36,1) both;
    }

    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 40px;
      animation: fadeUp 0.9s 0.4s cubic-bezier(.22,1,.36,1) both;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 18px 24px;
      flex: 1;
    }

    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      display: block;
      letter-spacing: 0.05em;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 14px 36px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.9s 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(200,245,71,0.25);
    }

    .footer {
      position: fixed;
      bottom: 24px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="badge">✦ Mein Testprojekt</div>
    <h1>Willkommen auf<br><span>meiner ersten Webseite</span></h1>
    <p>Diese Seite wurde mit Claude erstellt und über GitHub auf Vercel veröffentlicht. Der Anfang von etwas Großem.</p>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">1</span>
        <span class="stat-label">Projekt</span>
      </div>
      <div class="stat">
        <span class="stat-value">∞</span>
        <span class="stat-label">Möglichkeiten</span>
      </div>
      <div class="stat">
        <span class="stat-value">0€</span>
        <span class="stat-label">Kosten</span>
      </div>
    </div>

    <a class="btn" href="#">Los geht's 🚀</a>
  </div>

  <div class="footer">Erstellt mit Claude · Gehostet auf Vercel</div>

</body>
</html>
